<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="Troop B Zone 2 Court Date Finder – next court date at least 30 days out" />
  <title>Court Date Finder | Troop B Zone 2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">

    <header>
      <div class="badge-row">
        <span class="nysp-badge">NYSP</span>
        <span class="nysp-badge">Troop B · Zone 2</span>
      </div>
      <h1>Court Date Finder</h1>
      <p>Next court date ≥ 30 days out</p>
    </header>

    <div class="today" id="todayLabel"></div>
    <div class="error" id="errorBox"></div>

    <!-- Court first in tab order (skipped while disabled) -->
    <div class="card">
      <label for="courtSelect">Court / Town</label>
      <select id="courtSelect" disabled>
        <option value="">— Select a station first —</option>
      </select>
    </div>

    <div class="card">
      <label for="stationSelect">Station</label>
      <select id="stationSelect">
        <option value="">— Loading stations —</option>
      </select>
    </div>

    <div class="card result" id="resultCard">
      <div class="result-main">
        <div class="badge">≥ 30 DAYS OUT</div>
        <div class="result-date" id="resultDate">—</div>
        <div class="result-time" id="resultTime">—</div>
        <button class="copy-btn" id="copyBtn" type="button">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
            <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
          </svg>
          <span id="copyLabel">Copy Date &amp; Time</span>
        </button>
      </div>

      <div class="result-meta">
        <div>
          <span>Court</span>
          <span id="resultCourt">—</span>
        </div>
        <div>
          <span>Minimum date</span>
          <span id="resultMinDate">—</span>
        </div>
        <div>
          <span>Days from today</span>
          <span id="resultDays">—</span>
        </div>
        <div class="schedule-rules" id="scheduleRules"></div>
      </div>

      <div class="source-note" id="metaNote"></div>
    </div>

    <p class="note">
      Just looking for the schedule?
      <a href="schedules.html">Court schedules only</a>
      ·
      <a href="schedules.json" target="_blank" rel="noopener">schedules.json</a>
    </p>

    <footer id="footerMeta">
      Data from the Troop B Zone 2 Court Cheat Sheet and station post map.
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
